<section class="mx-5 mt-4 mb-4">
  <h1 class="text-2xl font-bold">Pipes no comunes</h1>
  <p class="text-sm">
    Este es un ejemplo de cómo usar las pipes no comunes de Angular.
  </p>
</section>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-4">
  <app-card title="i18nSelect Pipe">
    <p>
      Saludos {{ client().name }}, es un placer {{ client().gender | i18nSelect: invitationMap }} a nuestro evento.
    </p>
    <button class="btn btn-primary" (click)="changeClient()">Cambiar cliente</button>
  </app-card>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-4 mt-4">
  <app-card title="i18nPlural Pipe">
    <p>
      Actualmente {{ clients().length | i18nPlural: clientsMap }}
    </p>
    <button [disabled]="clients().length === 0" class="btn btn-primary" (click)="deleteClient()">Borrar cliente</button>
  </app-card>
</div>
